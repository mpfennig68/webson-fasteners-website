<title id="title">Shoulder screw dimensions</title><desc id="desc">Schematic side view. S is the smooth shoulder length from the bearing surface under the head to the shoulder transition. D is shoulder diameter. T is the axial length from that transition to the threaded-end tip. Not to scale; thread runout is simplified.</desc>
