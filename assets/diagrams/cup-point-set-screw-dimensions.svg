<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
<title id="title">Cup-point set-screw identification and dimensions</title>
<desc id="desc">Schematic side section of a headless set screw. The hex socket is at the left and the cup point at the right. L indicates overall length; d indicates nominal thread diameter. Not to scale.</desc>
