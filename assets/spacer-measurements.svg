<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Sleeve spacer dimensions</title><desc id="desc">Side view shows length L. The enlarged end view shows outside diameter OD above the spacer and inside diameter ID below it. Extension lines carry the bore edges to a separate dimension line, leaving the opening clear.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7Z" fill="#2a2d6b"/></marker></defs><rect width="900" height="440" fill="#f7f4ee"/><g fill="none" stroke="#2a2d6b" stroke-width="2.5"><path d="M70 150H410V310H70Z" fill="#edeef6"/><path d="M70 192H410M70 268H410" stroke-dasharray="9 7"/><path d="M70 323V370M410 323V370" stroke-width="1.5"/><path d="M74 354H406" marker-start="url(#arrow)" marker-end="url(#arrow)"/><circle cx="680" cy="220" r="95" fill="#edeef6"/><circle cx="680" cy="220" r="45" fill="#fff"/><path d="M585 115V76M775 115V76" stroke-width="1.5"/><path d="M589 88H771" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M635 220V370M725 220V370" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M639 354H721" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g fill="#2a2d6b" font-family="Arial,sans-serif" text-anchor="middle"><text x="240" y="105" font-size="23">SIDE VIEW</text><text x="240" y="402" font-size="30" font-weight="bold">L</text><text x="680" y="65" font-size="30" font-weight="bold">OD</text><text x="680" y="402" font-size="30" font-weight="bold">ID</text></g></svg>